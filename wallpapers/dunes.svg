<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7fca"/>
      <stop offset="0.35" stop-color="#77b6e6"/>
      <stop offset="0.55" stop-color="#cde4ef"/>
      <stop offset="0.66" stop-color="#f8e3bf"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.1" stop-color="#fffbe6"/>
      <stop offset="0.35" stop-color="#ffefc2" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffefc2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lit1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9d9a3"/>
      <stop offset="1" stop-color="#eab06a"/>
    </linearGradient>
    <linearGradient id="dark1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d48a4e"/>
      <stop offset="1" stop-color="#a95b30"/>
    </linearGradient>
    <linearGradient id="lit2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbcf8c"/>
      <stop offset="1" stop-color="#e79a52"/>
    </linearGradient>
    <linearGradient id="dark2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c06c34"/>
      <stop offset="1" stop-color="#8a4321"/>
    </linearGradient>
    <linearGradient id="lit3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd896"/>
      <stop offset="1" stop-color="#f0a457"/>
    </linearGradient>
    <linearGradient id="dark3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b1592a"/>
      <stop offset="1" stop-color="#6f3215"/>
    </linearGradient>
    <linearGradient id="hazeG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8e3bf" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f8e3bf" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <g fill="#ffffff" filter="url(#blur)" opacity="0.7">
    <ellipse cx="260" cy="170" rx="210" ry="22"/>
    <ellipse cx="420" cy="150" rx="120" ry="16"/>
    <ellipse cx="900" cy="120" rx="180" ry="14" opacity="0.6"/>
  </g>
  <circle cx="1240" cy="330" r="300" fill="url(#sun)"/>
  <circle cx="1240" cy="330" r="38" fill="#ffffff"/>

  <!-- far dunes -->
  <path d="M-40 600 C 160 560, 300 520, 480 545 C 640 565, 760 520, 940 520 C 1120 520, 1260 560, 1400 545 C 1500 535, 1580 545, 1640 555 L1640 640 L-40 640 Z" fill="#e7b882"/>
  <path d="M-40 600 C 160 560, 300 520, 480 545 C 520 560, 440 600, 380 640 L-40 640 Z" fill="#c98c58" opacity="0.6"/>
  <rect y="520" width="1600" height="90" fill="url(#hazeG)"/>

  <!-- middle dune: sunlit face and shadow face along a sharp crest -->
  <path d="M-40 720 C 120 660, 260 610, 420 600 C 560 592, 680 620, 820 650 L820 900 L-40 900 Z" fill="url(#lit1)"/>
  <path d="M420 600 C 560 592, 680 620, 820 650 C 960 680, 1100 640, 1240 610 C 1380 582, 1520 600, 1640 620 L1640 900 L820 900 C 760 820, 620 700, 420 600 Z" fill="url(#dark1)"/>
  <path d="M420 600 C 560 592, 680 620, 820 650 C 960 680, 1100 640, 1240 610 C 1380 582, 1520 600, 1640 620" fill="none" stroke="#ffe7bd" stroke-width="3" opacity="0.8" filter="url(#soft)"/>

  <!-- front dune -->
  <path d="M-40 900 L-40 760 C 140 700, 340 690, 520 730 C 700 770, 860 790, 1040 760 C 1140 744, 1200 760, 1240 790 L1240 900 Z" fill="url(#lit3)"/>
  <path d="M1040 760 C 1200 732, 1400 700, 1640 720 L1640 900 L1240 900 C 1220 840, 1150 790, 1040 760 Z" fill="url(#dark3)"/>
  <path d="M-40 760 C 140 700, 340 690, 520 730 C 700 770, 860 790, 1040 760 C 1200 732, 1400 700, 1640 720" fill="none" stroke="#fff1d0" stroke-width="3" opacity="0.85" filter="url(#soft)"/>

  <!-- wind ripples -->
  <g fill="none" stroke="#c9813f" stroke-width="2" stroke-linecap="round" opacity="0.35">
    <path d="M60 820 C 160 800, 260 802, 360 818"/>
    <path d="M110 850 C 230 828, 350 832, 470 848"/>
    <path d="M200 880 C 340 860, 480 862, 620 878"/>
    <path d="M420 800 C 520 786, 620 790, 720 804"/>
    <path d="M560 840 C 680 824, 800 828, 920 842"/>
    <path d="M100 700 C 180 684, 260 680, 340 690"/>
    <path d="M160 740 C 260 724, 360 722, 460 734"/>
  </g>
  <g fill="none" stroke="#5f2a10" stroke-width="2" stroke-linecap="round" opacity="0.25">
    <path d="M1300 800 C 1380 790, 1460 792, 1540 802"/>
    <path d="M1320 840 C 1420 828, 1500 830, 1600 842"/>
    <path d="M960 720 C 1040 708, 1120 706, 1200 716"/>
  </g>
</svg>
