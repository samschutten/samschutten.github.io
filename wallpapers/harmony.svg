<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.46" r="0.75">
      <stop offset="0" stop-color="#5fc2ff"/>
      <stop offset="0.18" stop-color="#2a8be6"/>
      <stop offset="0.45" stop-color="#1257b4"/>
      <stop offset="0.75" stop-color="#0a3478"/>
      <stop offset="1" stop-color="#051a43"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.2" stop-color="#c8f0ff" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#5cc0ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#5cc0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.35" stop-color="#bfeaff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#bfeaff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fdcff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#9fe6ff" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.8" stop-color="#6fc6ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6fc6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="band2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2fe0c8" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#5ff0d4" stop-opacity="0.4"/>
      <stop offset="0.7" stop-color="#bff8ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#bff8ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#bff0ff"/>
      <stop offset="0.35" stop-color="#46a8f2"/>
      <stop offset="0.8" stop-color="#1150b0"/>
      <stop offset="1" stop-color="#082f74"/>
    </radialGradient>
    <radialGradient id="orbLight" cx="0.5" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#9ff4ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#9ff4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="b30" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="b12" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="b4" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="b8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <symbol id="glint" viewBox="-20 -20 40 40">
      <path d="M0 -20 L2 -2 L20 0 L2 2 L0 20 L-2 2 L-20 0 L-2 -2 Z" fill="#fff"/>
    </symbol>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- light beams fanning out from the orb -->
  <g transform="translate(800 400)" filter="url(#b8)" opacity="0.7">
    <polygon points="0,-6 1100,-120 1100,60" fill="url(#beam)" transform="rotate(-24)"/>
    <polygon points="0,-4 1000,-40 1000,40" fill="url(#beam)" transform="rotate(-62)" opacity="0.6"/>
    <polygon points="0,-6 1100,-90 1100,90" fill="url(#beam)" transform="rotate(202)"/>
    <polygon points="0,-4 1000,-50 1000,30" fill="url(#beam)" transform="rotate(242)" opacity="0.6"/>
    <polygon points="0,-4 900,-30 900,30" fill="url(#beam)" transform="rotate(14)" opacity="0.5"/>
    <polygon points="0,-4 900,-30 900,30" fill="url(#beam)" transform="rotate(166)" opacity="0.5"/>
    <polygon points="0,-3 700,-26 700,26" fill="url(#beam)" transform="rotate(95)" opacity="0.35"/>
  </g>

  <!-- sweeping bands of light -->
  <g filter="url(#b12)">
    <path d="M-120 820 C 260 640, 560 610, 800 470 S 1260 180, 1720 120 L1720 220 C 1300 260, 1060 470, 820 560 S 300 760, -120 900 Z" fill="url(#band)" opacity="0.75"/>
    <path d="M-120 700 C 300 640, 600 520, 820 430 S 1300 300, 1720 330 L1720 380 C 1300 360, 1050 420, 830 480 S 320 690, -120 760 Z" fill="url(#band2)" opacity="0.8"/>
  </g>
  <g filter="url(#b4)" fill="none" stroke-linecap="round">
    <path d="M-120 830 C 260 650, 560 620, 800 480 S 1260 190, 1720 130" stroke="#e8fbff" stroke-width="3" opacity="0.75"/>
    <path d="M-120 720 C 300 660, 600 535, 820 445 S 1300 315, 1720 345" stroke="#c9fff6" stroke-width="2" opacity="0.6"/>
    <path d="M-120 610 C 300 600, 620 470, 820 410 S 1340 380, 1720 470" stroke="#ffffff" stroke-width="1.5" opacity="0.35"/>
  </g>

  <!-- the glowing Skutn orb -->
  <circle cx="800" cy="400" r="330" fill="url(#halo)" opacity="0.85"/>
  <g transform="translate(800 400)">
    <circle r="112" fill="#bff0ff" opacity="0.35" filter="url(#b30)"/>
    <circle r="96" fill="url(#orb)" stroke="#0a3070" stroke-width="2"/>
    <circle r="96" fill="url(#orbLight)"/>
    <!-- floppy glyph -->
    <g fill="#ffffff" opacity="0.95">
      <path d="M-40 -44 h68 l14 14 v74 a6 6 0 0 1 -6 6 h-76 a6 6 0 0 1 -6 -6 v-82 a6 6 0 0 1 6 -6 z"/>
    </g>
    <rect x="-24" y="-44" width="40" height="28" rx="3" fill="#1c63c8"/>
    <rect x="2" y="-40" width="9" height="20" rx="1.5" fill="#ffffff"/>
    <rect x="-30" y="2" width="60" height="40" rx="3" fill="#cfe9ff"/>
    <path d="M-22 14 h44 M-22 24 h44 M-22 34 h30" stroke="#5a9de0" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="0" cy="-52" rx="72" ry="36" fill="url(#gloss)"/>
    <circle r="95" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2"/>
  </g>

  <!-- sparkles and soft bokeh -->
  <g fill="#ffffff" filter="url(#b8)">
    <circle cx="300" cy="640" r="26" opacity="0.15"/>
    <circle cx="470" cy="560" r="14" opacity="0.22"/>
    <circle cx="1130" cy="300" r="22" opacity="0.18"/>
    <circle cx="1290" cy="230" r="12" opacity="0.28"/>
    <circle cx="1040" cy="560" r="30" opacity="0.1"/>
    <circle cx="640" cy="250" r="18" opacity="0.12"/>
  </g>
  <use href="#glint" x="1018" y="232" width="34" height="34" opacity="0.9"/>
  <use href="#glint" x="560" y="526" width="24" height="24" opacity="0.8"/>
  <use href="#glint" x="1342" y="168" width="18" height="18" opacity="0.7"/>
  <use href="#glint" x="244" y="700" width="20" height="20" opacity="0.6"/>
</svg>
