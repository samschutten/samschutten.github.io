<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#03163a"/>
      <stop offset="0.5" stop-color="#0a4596"/>
      <stop offset="1" stop-color="#1a7ad6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.82" r="0.6">
      <stop offset="0" stop-color="#8fe0ff" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#3aa0ee" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#3aa0ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.15" r="0.45">
      <stop offset="0" stop-color="#5fb7ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5fb7ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#d8f4ff" stop-opacity="0.9"/>
      <stop offset="0.7" stop-color="#7fd0ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="softer" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="bokeh" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#glow2)"/>

  <g fill="none" stroke="url(#ribbon)" stroke-linecap="round">
    <path d="M-100 700 C 300 520, 650 820, 1000 560 S 1500 380, 1750 470" stroke-width="90" opacity="0.35" filter="url(#soft)"/>
    <path d="M-100 760 C 280 600, 700 860, 1050 620 S 1480 470, 1750 540" stroke-width="40" opacity="0.5" filter="url(#soft)"/>
    <path d="M-100 690 C 320 540, 660 800, 1010 575 S 1500 400, 1750 480" stroke-width="5" opacity="0.9" filter="url(#softer)"/>
    <path d="M-100 735 C 300 585, 690 840, 1035 600 S 1490 440, 1750 515" stroke-width="2" opacity="0.8"/>
    <path d="M-100 640 C 350 480, 640 740, 980 520 S 1520 330, 1750 420" stroke-width="2" opacity="0.45"/>
  </g>

  <g fill="#ffffff" filter="url(#bokeh)">
    <circle cx="260" cy="520" r="22" opacity="0.18"/>
    <circle cx="410" cy="640" r="12" opacity="0.25"/>
    <circle cx="720" cy="600" r="30" opacity="0.12"/>
    <circle cx="980" cy="470" r="16" opacity="0.22"/>
    <circle cx="1230" cy="430" r="26" opacity="0.14"/>
    <circle cx="1390" cy="520" r="10" opacity="0.3"/>
    <circle cx="560" cy="760" r="18" opacity="0.16"/>
    <circle cx="1120" cy="680" r="14" opacity="0.18"/>
  </g>
  <g fill="#ffffff">
    <circle cx="300" cy="610" r="1.6" opacity="0.8"/>
    <circle cx="860" cy="690" r="1.2" opacity="0.7"/>
    <circle cx="1310" cy="470" r="1.4" opacity="0.8"/>
    <circle cx="640" cy="560" r="1" opacity="0.6"/>
  </g>
</svg>
