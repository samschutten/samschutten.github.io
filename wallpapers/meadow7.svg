  </g>
  <path d="M-50 640C220 520 520 540 760 600S1240 640 1650 520V900H-50z" fill="url(#far)" filter="url(#haze)"/>
  <path d="M-50 720C260 600 640 640 920 700S1350 720 1650 640V900H-50z" fill="url(#near)"/>
  <path d="M-50 720C260 600 640 640 920 700S1350 720 1650 640" fill="none" stroke="url(#rim)" stroke-width="4" filter="url(#soft)"/>
  <use href="#b" x="180" y="330" width="90" height="90"/>
  <use href="#b" x="300" y="460" width="46" height="46"/>
  <use href="#b" x="1250" y="400" width="120" height="120"/>
  <use href="#b" x="1400" y="300" width="56" height="56"/>
  <use href="#b" x="700" y="420" width="64" height="64"/>
  <use href="#b" x="560" y="300" width="32" height="32"/>
