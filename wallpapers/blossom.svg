<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="sky" cx="0.7" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#e6f4fd"/>
      <stop offset="0.45" stop-color="#9fcfee"/>
      <stop offset="1" stop-color="#4f93cf"/>
    </radialGradient>
    <radialGradient id="petal" cx="0.5" cy="0.9" r="0.95">
      <stop offset="0" stop-color="#e2557f"/>
      <stop offset="0.3" stop-color="#f6a3bd"/>
      <stop offset="0.75" stop-color="#fde3ec"/>
      <stop offset="1" stop-color="#ffffff"/>
    </radialGradient>
    <radialGradient id="bud" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffd1df"/>
      <stop offset="1" stop-color="#d9416c"/>
    </radialGradient>
    <linearGradient id="bark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4436"/>
      <stop offset="1" stop-color="#3a221a"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8e07a"/>
      <stop offset="1" stop-color="#5c9a35"/>
    </linearGradient>
    <filter id="bokeh" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="far" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="3" dy="5"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <symbol id="flower" viewBox="-60 -60 120 120" overflow="visible">
      <g>
        <path id="p" d="M0 -4 C -16 -14, -22 -38, -10 -52 C -6 -48, -2 -46, 0 -50 C 2 -46, 6 -48, 10 -52 C 22 -38, 16 -14, 0 -4 Z" fill="url(#petal)" stroke="#e98aa8" stroke-width="0.8"/>
        <use xlink:href="#p" href="#p" transform="rotate(72)"/>
        <use xlink:href="#p" href="#p" transform="rotate(144)"/>
        <use xlink:href="#p" href="#p" transform="rotate(216)"/>
        <use xlink:href="#p" href="#p" transform="rotate(288)"/>
      </g>
      <circle r="9" fill="#c93a62"/>
      <g stroke="#f4dcae" stroke-width="1.2" stroke-linecap="round">
        <path d="M0 0 L0 -20"/><path d="M0 0 L14 -14"/><path d="M0 0 L20 0"/><path d="M0 0 L14 14"/>
        <path d="M0 0 L0 20"/><path d="M0 0 L-14 14"/><path d="M0 0 L-20 0"/><path d="M0 0 L-14 -14"/>
        <path d="M0 0 L8 -18"/><path d="M0 0 L-8 18"/><path d="M0 0 L18 8"/><path d="M0 0 L-18 -8"/>
      </g>
      <g fill="#f6c34a">
        <circle cy="-20" r="2.4"/><circle cx="14" cy="-14" r="2.4"/><circle cx="20" r="2.4"/><circle cx="14" cy="14" r="2.4"/>
        <circle cy="20" r="2.4"/><circle cx="-14" cy="14" r="2.4"/><circle cx="-20" r="2.4"/><circle cx="-14" cy="-14" r="2.4"/>
        <circle cx="8" cy="-18" r="2"/><circle cx="-8" cy="18" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="-18" cy="-8" r="2"/>
      </g>
    </symbol>
    <symbol id="budS" viewBox="-20 -30 40 50" overflow="visible">
      <path d="M0 14 C -12 4, -12 -14, 0 -26 C 12 -14, 12 4, 0 14 Z" fill="url(#bud)"/>
      <path d="M0 14 C -8 10, -12 4, -10 -2 C -4 2, -2 8, 0 14 Z M0 14 C 8 10, 12 4, 10 -2 C 4 2, 2 8, 0 14 Z" fill="#6c9a3a"/>
    </symbol>
    <symbol id="leafS" viewBox="-10 -60 20 60" overflow="visible">
      <path d="M0 0 C -14 -16, -14 -40, 0 -58 C 14 -40, 14 -16, 0 0 Z" fill="url(#leaf)"/>
      <path d="M0 -2 L0 -54" stroke="#4a7d2b" stroke-width="1.2"/>
    </symbol>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- out-of-focus blossoms far behind -->
  <g filter="url(#bokeh)">
    <circle cx="1240" cy="200" r="60" fill="#ffffff" opacity="0.5"/>
    <circle cx="1400" cy="320" r="40" fill="#ffd9e6" opacity="0.6"/>
    <circle cx="1100" cy="380" r="50" fill="#ffffff" opacity="0.35"/>
    <circle cx="1460" cy="130" r="34" fill="#ffc6d8" opacity="0.6"/>
    <circle cx="980" cy="160" r="28" fill="#ffffff" opacity="0.45"/>
    <circle cx="1320" cy="520" r="70" fill="#ffd9e6" opacity="0.35"/>
    <circle cx="1520" cy="620" r="44" fill="#ffffff" opacity="0.4"/>
    <circle cx="880" cy="700" r="60" fill="#ffe3ec" opacity="0.3"/>
    <circle cx="1180" cy="760" r="40" fill="#ffffff" opacity="0.35"/>
  </g>
  <g filter="url(#far)" opacity="0.55" transform="translate(1100 220) rotate(-14)">
    <path d="M-60 120 C 0 60, 80 30, 240 -20" stroke="#6b4436" stroke-width="10" fill="none" stroke-linecap="round"/>
    <use href="#flower" x="10" y="20" width="90" height="90"/>
    <use href="#flower" x="130" y="-40" width="70" height="70"/>
  </g>

  <!-- main branch -->
  <g filter="url(#shadow)" transform="translate(-90 -380) scale(1.55)">
    <path d="M-40 760 C 120 700, 260 640, 420 560 C 520 510, 600 470, 700 440 C 780 416, 860 420, 940 400 L944 410 C 860 432, 784 430, 706 452 C 610 482, 530 522, 430 574 C 270 656, 128 718, -40 790 Z" fill="url(#bark)"/>
    <path d="M420 562 C 400 500, 410 440, 450 380 L458 384 C 422 444, 412 500, 432 566 Z" fill="url(#bark)"/>
    <path d="M700 442 C 720 400, 760 370, 820 350 L822 358 C 766 378, 728 404, 710 446 Z" fill="url(#bark)"/>
    <path d="M220 660 C 240 620, 260 600, 300 590 L302 598 C 266 608, 250 626, 230 664 Z" fill="url(#bark)"/>

    <use href="#leafS" x="590" y="470" width="20" height="60" transform="rotate(-30 600 500)"/>
    <use href="#leafS" x="340" y="600" width="20" height="60" transform="rotate(40 350 630)"/>
    <use href="#leafS" x="860" y="380" width="20" height="60" transform="rotate(-60 870 410)"/>

    <use href="#flower" x="380" y="480" width="150" height="150" transform="rotate(12 455 555)"/>
    <use href="#flower" x="560" y="390" width="120" height="120" transform="rotate(-20 620 450)"/>
    <use href="#flower" x="400" y="320" width="110" height="110" transform="rotate(30 455 375)"/>
    <use href="#flower" x="740" y="330" width="130" height="130" transform="rotate(-8 805 395)"/>
    <use href="#flower" x="200" y="560" width="120" height="120" transform="rotate(20 260 620)"/>
    <use href="#flower" x="880" y="350" width="90" height="90" transform="rotate(40 925 395)"/>
    <use href="#flower" x="60" y="640" width="100" height="100" transform="rotate(-15 110 690)"/>

    <use href="#budS" x="796" y="316" width="32" height="40" transform="rotate(20 812 336)"/>
    <use href="#budS" x="440" y="340" width="26" height="32" transform="rotate(-25 453 356)"/>
    <use href="#budS" x="296" y="560" width="26" height="32" transform="rotate(35 309 576)"/>
  </g>

  <!-- drifting petals -->
  <g fill="#ffd5e2" opacity="0.9">
    <path d="M1000 520 c 10 -12, 26 -10, 30 2 c -10 10, -24 10, -30 -2 z" transform="rotate(25 1015 520)"/>
    <path d="M760 640 c 8 -10, 22 -8, 25 2 c -8 8, -20 8, -25 -2 z" transform="rotate(-30 772 640)"/>
    <path d="M1180 600 c 10 -12, 24 -10, 28 2 c -9 9, -22 9, -28 -2 z" transform="rotate(60 1194 600)"/>
    <path d="M560 740 c 9 -11, 24 -9, 27 2 c -9 9, -22 9, -27 -2 z" transform="rotate(10 573 740)"/>
    <path d="M1360 440 c 8 -10, 20 -8, 23 2 c -8 8, -18 8, -23 -2 z" transform="rotate(-50 1371 440)"/>
  </g>
</svg>
