<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1532"/>
      <stop offset="0.35" stop-color="#2b2f69"/>
      <stop offset="0.55" stop-color="#7a4a7a"/>
      <stop offset="0.68" stop-color="#e07a5f"/>
      <stop offset="0.74" stop-color="#f7b56e"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c2a52"/>
      <stop offset="0.5" stop-color="#2d4479"/>
      <stop offset="1" stop-color="#16203f"/>
    </linearGradient>
    <linearGradient id="glassLit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a6aa8"/>
      <stop offset="0.6" stop-color="#28396a"/>
      <stop offset="1" stop-color="#1a2549"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1f3e"/>
      <stop offset="1" stop-color="#0f1328"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3f6e"/>
      <stop offset="1" stop-color="#3a2d58"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2d58"/>
      <stop offset="1" stop-color="#070b1d"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd9a8" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffd9a8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="win1" width="12" height="16" patternUnits="userSpaceOnUse">
      <rect x="3" y="4" width="5" height="7" fill="#ffd98a" opacity="0.85"/>
    </pattern>
    <pattern id="win2" width="16" height="14" patternUnits="userSpaceOnUse">
      <rect x="2" y="3" width="10" height="5" fill="#ffe7b5" opacity="0.7"/>
    </pattern>
    <pattern id="win3" width="9" height="12" patternUnits="userSpaceOnUse">
      <rect x="2" y="3" width="4" height="5" fill="#bfe0ff" opacity="0.55"/>
    </pattern>
    <pattern id="dim" width="24" height="40" patternUnits="userSpaceOnUse">
      <rect width="24" height="40" fill="#0f1328" opacity="0.55"/>
      <rect x="12" y="20" width="12" height="20" fill="#0f1328" opacity="0.35"/>
    </pattern>
    <filter id="refl"><feGaussianBlur stdDeviation="2 6"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <g id="skyline">
      <path d="M-20 640 V520 h70 v-30 h60 v40 h50 v-70 h40 v90 h80 v-50 h60 v60 h50 v-90 h70 v110 h60 v-40 h90 v60 h70 v-80 h50 v90 h80 v-30 h60 v50 h70 v-70 h70 v80 h60 v-40 h80 v60 h60 V640 Z" fill="url(#far)"/>

      <rect x="80" y="380" width="110" height="260" fill="url(#dark)"/>
      <rect x="80" y="380" width="110" height="260" fill="url(#win1)"/>
      <rect x="80" y="380" width="110" height="260" fill="url(#dim)"/>

      <path d="M230 640 V300 l60 -40 l60 40 V640 Z" fill="url(#glassLit)"/>
      <path d="M230 640 V300 l60 -40 l60 40 V640 Z" fill="url(#win3)"/>
      <path d="M290 260 V640" stroke="#0f1328" stroke-width="2"/>

      <rect x="380" y="430" width="90" height="210" fill="url(#dark)"/>
      <rect x="380" y="430" width="90" height="210" fill="url(#win2)"/>

      <rect x="500" y="210" width="120" height="430" fill="url(#glass)"/>
      <rect x="500" y="210" width="120" height="430" fill="url(#win3)"/>
      <rect x="500" y="210" width="6" height="430" fill="url(#edge)"/>
      <rect x="540" y="170" width="40" height="40" fill="url(#glass)"/>
      <path d="M560 170 V90" stroke="#3a4777" stroke-width="4"/>
      <circle cx="560" cy="88" r="4" fill="#ff5c4a"/>
      <circle cx="560" cy="88" r="9" fill="#ff5c4a" opacity="0.5" filter="url(#glow)"/>

      <rect x="650" y="350" width="140" height="290" fill="url(#dark)"/>
      <rect x="650" y="350" width="140" height="290" fill="url(#win1)"/>
      <rect x="650" y="350" width="140" height="290" fill="url(#dim)"/>
      <rect x="650" y="340" width="140" height="10" fill="#242b52"/>

      <path d="M820 640 V260 C 820 230, 900 200, 940 260 V640 Z" fill="url(#glassLit)"/>
      <path d="M820 640 V260 C 820 230, 900 200, 940 260 V640 Z" fill="url(#win3)"/>
      <path d="M826 270 C 840 240, 880 226, 910 240" stroke="#ffd9a8" stroke-width="3" fill="none" opacity="0.6"/>

      <rect x="970" y="400" width="100" height="240" fill="url(#dark)"/>
      <rect x="970" y="400" width="100" height="240" fill="url(#win2)"/>

      <rect x="1100" y="160" width="100" height="480" fill="url(#glass)"/>
      <rect x="1100" y="160" width="100" height="480" fill="url(#win1)"/>
      <rect x="1100" y="160" width="100" height="480" fill="url(#dim)"/>
      <path d="M1100 160 L1150 110 L1200 160 Z" fill="#2d4479"/>
      <path d="M1150 110 V60" stroke="#3a4777" stroke-width="3"/>
      <circle cx="1150" cy="58" r="3.5" fill="#ff5c4a"/>

      <rect x="1230" y="330" width="120" height="310" fill="url(#glassLit)"/>
      <rect x="1230" y="330" width="120" height="310" fill="url(#win3)"/>
      <rect x="1230" y="330" width="5" height="310" fill="url(#edge)"/>

      <rect x="1380" y="440" width="90" height="200" fill="url(#dark)"/>
      <rect x="1380" y="440" width="90" height="200" fill="url(#win2)"/>
      <rect x="1490" y="380" width="130" height="260" fill="url(#dark)"/>
      <rect x="1490" y="380" width="130" height="260" fill="url(#win1)"/>
      <rect x="1490" y="380" width="130" height="260" fill="url(#dim)"/>
    </g>
  </defs>

  <rect width="1600" height="640" fill="url(#sky)"/>
  <circle cx="420" cy="560" r="240" fill="#ffb47a" opacity="0.25" filter="url(#glow)"/>
  <g fill="#ffffff">
    <circle cx="200" cy="60" r="1.2" opacity="0.7"/><circle cx="700" cy="40" r="1" opacity="0.6"/>
    <circle cx="980" cy="90" r="1.4" opacity="0.8"/><circle cx="1400" cy="50" r="1" opacity="0.6"/>
    <circle cx="1300" cy="140" r="0.8" opacity="0.5"/><circle cx="400" cy="120" r="0.9" opacity="0.5"/>
  </g>

  <use href="#skyline"/>

  <rect y="640" width="1600" height="260" fill="url(#water)"/>
  <g transform="translate(0 1280) scale(1 -1)" opacity="0.4" filter="url(#refl)">
    <use href="#skyline"/>
  </g>
  <g stroke="#ffd98a" stroke-linecap="round" opacity="0.35">
    <path d="M100 680 h60 M300 700 h40 M560 690 h50 M700 720 h70 M1120 690 h60 M1260 710 h40 M1500 700 h70" stroke-width="2"/>
    <path d="M140 760 h40 M520 780 h70 M880 760 h50 M1180 790 h60 M1420 770 h40" stroke-width="1.5"/>
  </g>
  <rect y="636" width="1600" height="6" fill="#ffcf9a" opacity="0.35" filter="url(#glow)"/>
</svg>
